<main>

<h1>Seven Thrones</h1>

<p>
The Seven Thrones are the strongest Fragmental Fusions beneath Ainul himself.
</p>

<div id="thrones-container">

</div>

</main>

<script type="module">

const throneNames = [
    "Grey",
    "Eventide",
    "Phlox",
    "Vermilion",
    "Acid"
];

const container =
    document.getElementById("thrones-container");

throneNames.forEach(name => {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
        <h2>${name}</h2>
    `;

    container.appendChild(card);

});

</script>
